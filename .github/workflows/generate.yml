name: Generate

# Regenerates the UI screenshots from the demo scenario on every push to a working branch and
# commits the changed images straight back onto that branch (F14.7). The commits go through the
# contents API, so GitHub signs them, and they cannot trigger another push workflow; for an open
# pull request CI is then dispatched on the generated head.
on:
  push:
    branches-ignore: [main, master]
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: github-issue-worker ui --demo --screenshots docs/screenshots
      - name: Validate screenshots
        run: |
          for file in issues workers log issue repositories fleet settings; do
            path="docs/screenshots/$file.png"
            test -f "$path" || { echo "missing $path"; exit 1; }
            test "$(stat -c %s "$path")" -gt 10000 || { echo "implausibly small $path"; exit 1; }
          done
      - uses: Hawkynt/RepositoryTemplate/commit-generated-file@v1
        with:
          file: docs/screenshots/issues.png
          message: '* refresh the issues page screenshot'
      - uses: Hawkynt/RepositoryTemplate/commit-generated-file@v1
        with:
          file: docs/screenshots/log.png
          message: '* refresh the log page screenshot'
      - uses: Hawkynt/RepositoryTemplate/commit-generated-file@v1
        with:
          file: docs/screenshots/issue.png
          message: '* refresh the issue page screenshot'
      - uses: Hawkynt/RepositoryTemplate/commit-generated-file@v1
        with:
          file: docs/screenshots/workers.png
          message: '* refresh the workers page screenshot'
      - uses: Hawkynt/RepositoryTemplate/commit-generated-file@v1
        with:
          file: docs/screenshots/repositories.png
          message: '* refresh the repositories page screenshot'
      - uses: Hawkynt/RepositoryTemplate/commit-generated-file@v1
        with:
          file: docs/screenshots/fleet.png
          message: '* refresh the fleet page screenshot'
      - uses: Hawkynt/RepositoryTemplate/commit-generated-file@v1
        with:
          file: docs/screenshots/settings.png
          message: '* refresh the settings page screenshot'

  # A commit made with the workflow token cannot start another workflow, so the pull request's
  # checks would stay on the head before the screenshots. Run CI on the generated head explicitly.
  trigger-ci:
    name: Run CI on the generated head
    needs: screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch CI for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch="$GITHUB_REF_NAME"
          generated_head=$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq '.commit.sha')
          if [ "$generated_head" = "$GITHUB_SHA" ]; then
            exit 0
          fi
          open_prs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="${GITHUB_REPOSITORY_OWNER}:$branch" --jq 'length')
          if [ "$open_prs" -eq 0 ]; then
            exit 0
          fi
          gh workflow run ci.yml --ref "$branch"
